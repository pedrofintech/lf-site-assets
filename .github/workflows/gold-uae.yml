name: Update UAE gold rates (BrokerMatch)

on:
  schedule:
    # Every 2 hours from 03:17 to 19:17 UTC (07:17 to 23:17 UAE time).
    # The Dubai Jewellery Group changes its rates in the morning, afternoon and evening.
    - cron: '17 3-19/2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gold-uae/update.py'
      - '.github/workflows/gold-uae.yml'

permissions:
  contents: write

concurrency:
  group: gold-uae
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update gold data
        run: python gold-uae/update.py

      - name: Commit and push if changed
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "gold-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold-uae/gold-data.json gold-uae/djg-archive.json
          git diff --cached --quiet && exit 0
          git commit -m "Update UAE gold rates $(date -u +%FT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
